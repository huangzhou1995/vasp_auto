# ============================================================
# vasp_auto configuration
# ============================================================

slurm:
  template: ~/software/vasp_auto/sub_vasp_P100.sh
  partition: "compute"
  nodes: 1
  ntasks_per_node: 32
  time: "24:00:00"
  job_name_prefix: "vasp"
  extra: ""

vasp:
  exec: "vasp_std"

work_dir: "./"
poll_interval: 60
max_wait: 604800
mode: "sequential"

potcar:
  auto_generate: true

kpoints:
  auto_generate: true
  mode: "direct"
  scheme: "M"
  mesh: [0, 0, 0]
  kpoints_density: 0.04

resume:
  skip_completed: true
  retry_failed: true
  max_retries: 1

steps:
  opt:
    enabled: true
    job_name: "opt"
    dir: "opt"
    incar:
      ENCUT: 400
      PREC: "Normal"
      LREAL: "Auto"
      ISMEAR: 0
      SIGMA: 0.05
      ISIF: 2
      IBRION: 2
      NSW: 500
      EDIFF: 1.0e-5
      EDIFFG: -0.02
      LWAVE: False
      LCHARG: True
      NCORE: 6
      ISPIN: 2
      ISTART: 0
      IVDW: 11
      ALGO: "Normal"

  scf:
    enabled: true
    job_name: "scf"
    dir: "scf"
    incar:
      SYSTEM: sys
      PREC: Normal
      ENCUT: 400
      IBRION: -1
      GGA: PE
      POTIM: 0.5
      NSW: 0
      ISIF: 2
      EDIFF: 1.0e-5
      EDIFFG: -0.05
      ALGO: "N"
      LCHARG: True
      LAECHG: False
      ISPIN: 2
      ISTART: 0
      ICHARG: 2
      ISMEAR: 0
      SIGMA: 0.05
      LREAL: A
      NCORE: 6
      IVDW: 11
      AMIX: 0.2
      BMIX: 0.0001
      AMIX_MAG: 0.8

  dos:
    enabled: true
    job_name: "dos"
    dir: "dos"
    kpoints:
      kpoints_density: 0.02
      scheme: "G"
    incar:
      SYSTEM: sys
      PREC: Normal
      ENCUT: 400
      IBRION: -1
      GGA: PE
      POTIM: 0.5
      NSW: 0
      ISIF: 2
      EDIFF: 1.0e-5
      EDIFFG: -0.05
      ALGO: "N"
      LCHARG: True
      LAECHG: False
      LORBIT: 11
      NEDOS: 2000
      ISPIN: 2
      ISTART: 1
      ICHARG: 11
      ISMEAR: -5
      SIGMA: 0.05
      LREAL: A
      NCORE: 6
      IVDW: 11
      AMIX: 0.2
      BMIX: 0.0001
      AMIX_MAG: 0.8
      KBLOWUP: False

postprocess:
  vaspkit_tasks: []
